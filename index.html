<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouaga Route</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5c4a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--vert:#0f5c4a;--sable:#f3ead7;--rouge:#c8442b;--txt:#1d2b27}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,sans-serif;color:var(--txt)}
#map{position:absolute;inset:0}
#panel{position:absolute;z-index:1000;left:10px;right:10px;top:10px;max-width:420px;background:var(--sable);border-radius:14px;padding:12px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
h1{font-size:18px;margin:0 0 8px;color:var(--vert)}
.row{display:flex;gap:6px;margin-bottom:6px}
input{flex:1;min-width:0;padding:10px;border:1px solid #bfb594;border-radius:8px;font-size:16px;background:#fff}
button{padding:10px 12px;border:0;border-radius:8px;font-size:15px;background:var(--vert);color:#fff;cursor:pointer}
button.sec{background:#fff;color:var(--vert);border:1px solid var(--vert)}
button:focus-visible,input:focus-visible{outline:3px solid var(--rouge);outline-offset:1px}
.modes,.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.modes button,.chips button{background:#fff;color:var(--vert);border:1px solid var(--vert);padding:7px 10px;font-size:14px}
.modes button.on,.chips button.on{background:var(--vert);color:#fff}
.pop button{margin:4px 4px 0 0;padding:6px 9px;font-size:13px}
#info{margin-top:6px;font-size:15px;min-height:20px}
#info b{color:var(--rouge)}
#sug{list-style:none;margin:0 0 6px;padding:0;background:#fff;border-radius:8px;max-height:160px;overflow:auto}
#sug li{padding:9px 10px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Ouaga Route</h1>
  <div class="row"><input id="a" placeholder="Départ (ex : Gounghin)" autocomplete="off"><button class="sec" id="loc" title="Ma position">📍</button></div>
  <div class="row"><input id="b" placeholder="Arrivée (ex : Marché de Rood-Woko)" autocomplete="off"></div>
  <ul id="sug" hidden></ul>
  <div class="row"><button id="go" style="flex:1">Voir l'itinéraire</button><button class="sec" id="swap" title="Inverser">⇅</button></div>
  <div class="modes" id="modes"><button data-m="car" class="on">🚗 Voiture</button><button data-m="moto">🏍️ Moto</button><button data-m="foot">🚶 À pied</button></div>
  <div class="chips" id="chips"><button data-t="pharmacy">Pharmacies</button><button data-t="hospital">Santé</button><button data-t="marketplace">Marchés</button><button data-t="bus">Arrêts de bus</button><button data-t="fuel">Stations</button><button data-t="bank">Banques</button><button id="add">＋ Ajouter un lieu</button></div>
  <div id="info">Tape un lieu ou touche la carte pour choisir le départ, puis l'arrivée.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const bounds=L.latLngBounds([12.26,-1.68],[12.49,-1.38]);
const map=L.map('map',{maxBounds:bounds,maxBoundsViscosity:1,minZoom:11}).setView([12.3714,-1.5197],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let pts={a:null,b:null},marks={a:null,b:null},line=null,active='a';
const $=id=>document.getElementById(id), info=$('info'), sug=$('sug');

function setPoint(k,ll,label){
  pts[k]=ll; if(label)$(k).value=label;
  if(marks[k])map.removeLayer(marks[k]);
  marks[k]=L.marker(ll,{title:k==='a'?'Départ':'Arrivée'}).addTo(map).bindTooltip(k==='a'?'Départ':'Arrivée');
}
map.on('click',e=>{
  if(!bounds.contains(e.latlng))return;
  if(addMode){addPlace(e.latlng);return}
  const k=pts.a&&!pts.b?'b':(!pts.a?'a':'b');
  setPoint(k,e.latlng,'Point sur la carte');
  if(pts.a&&pts.b)route(); else info.textContent='Départ choisi. Touche maintenant l\'arrivée.';
});

async function search(q){
  const u='https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=bf&bounded=1&viewbox=-1.68,12.49,-1.38,12.26&q='+encodeURIComponent(q);
  const r=await fetch(u); return r.json();
}
let timer;
['a','b'].forEach(k=>$(k).addEventListener('input',()=>{
  active=k; clearTimeout(timer);
  const q=$(k).value.trim(); if(q.length<3){sug.hidden=true;return}
  timer=setTimeout(async()=>{
    try{
      const res=await search(q+' Ouagadougou');
      sug.innerHTML='';
      if(!res.length){sug.innerHTML='<li>Aucun lieu trouvé. Touche la carte à la place.</li>';sug.hidden=false;return}
      res.forEach(p=>{const li=document.createElement('li');li.textContent=p.display_name.split(',').slice(0,3).join(',');
        li.onclick=()=>{setPoint(k,L.latLng(+p.lat,+p.lon),li.textContent);sug.hidden=true;map.panTo([p.lat,p.lon]);if(pts.a&&pts.b)route()};
        sug.appendChild(li)});
      sug.hidden=false;
    }catch(e){info.textContent='Recherche indisponible. Touche la carte pour choisir un point.'}
  },500);
}));

$('loc').onclick=()=>{
  navigator.geolocation?.getCurrentPosition(p=>{
    const ll=L.latLng(p.coords.latitude,p.coords.longitude);
    if(!bounds.contains(ll)){info.textContent='Tu n\'es pas à Ouagadougou : choisis un départ sur la carte.';return}
    setPoint('a',ll,'Ma position');map.setView(ll,15);if(pts.b)route();
  },()=>info.textContent='Position refusée. Autorise la localisation ou choisis un point.');
};
$('swap').onclick=()=>{
  const A=pts.a,B=pts.b,va=$('a').value,vb=$('b').value;
  if(B)setPoint('a',B,vb);if(A)setPoint('b',A,va);
  if(pts.a&&pts.b)route();
};
$('go').onclick=()=>{ if(pts.a&&pts.b)route(); else info.textContent='Choisis d\'abord un départ et une arrivée.' };

let mode='car';
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));
  if(pts.a&&pts.b)route();
});
async function route(){
  info.textContent='Calcul en cours…';
  const c=`${pts.a.lng},${pts.a.lat};${pts.b.lng},${pts.b.lat}`;
  const u=mode==='foot'?`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${c}?overview=full&geometries=geojson`
    :`https://router.project-osrm.org/route/v1/driving/${c}?overview=full&geometries=geojson`;
  try{
    const d=await (await fetch(u)).json();
    if(!d.routes?.length){info.textContent='Aucun itinéraire trouvé entre ces deux points.';return}
    const r=d.routes[0];
    if(line)map.removeLayer(line);
    line=L.geoJSON(r.geometry,{style:{color:mode==='foot'?'#0f5c4a':'#c8442b',weight:6,dashArray:mode==='foot'?'1 10':null,lineCap:'round'}}).addTo(map);
    map.fitBounds(line.getBounds(),{padding:[40,40]});
    const km=r.distance/1000;
    const min=Math.round(mode==='car'?r.duration/60:km/(mode==='moto'?30:5)*60);
    const lab={car:'en voiture',moto:'à moto (estimation)',foot:'à pied'}[mode];
    info.innerHTML=`<b>${km.toFixed(1)} km</b> · environ <b>${min} min</b> ${lab}`;
  }catch(e){info.textContent='Itinéraire indisponible. Vérifie ta connexion.'}
}

/* Lieux */
const lieux=L.layerGroup().addTo(map), perso=L.layerGroup().addTo(map);
const noms={pharmacy:'Pharmacie',hospital:'Santé',marketplace:'Marché',fuel:'Station',bus:'Arrêt de bus',bank:'Banque'};
const Q={pharmacy:'["amenity"="pharmacy"]',hospital:'["amenity"~"hospital|clinic"]',marketplace:'["amenity"="marketplace"]',fuel:'["amenity"="fuel"]',bus:'["highway"="bus_stop"]',bank:'["amenity"="bank"]'};
function popup(ll,nom){
  const d=document.createElement('div');d.className='pop';
  d.innerHTML='<b></b><br><button>Départ ici</button><button>Arrivée ici</button>';
  d.querySelector('b').textContent=nom;
  const [bd,ba]=d.querySelectorAll('button');
  bd.onclick=()=>{setPoint('a',ll,nom);map.closePopup();if(pts.b)route()};
  ba.onclick=()=>{setPoint('b',ll,nom);map.closePopup();if(pts.a)route()};
  return d;
}
document.querySelectorAll('#chips button[data-t]').forEach(b=>b.onclick=async()=>{
  const t=b.dataset.t;lieux.clearLayers();
  document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===b));
  info.textContent='Recherche des lieux sur la carte…';
  const m=map.getBounds(),bb=`${m.getSouth()},${m.getWest()},${m.getNorth()},${m.getEast()}`;
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(`[out:json][timeout:25];nwr${Q[t]}(${bb});out center 200;`)});
    const d=await r.json();let n=0;
    d.elements.forEach(e=>{
      const la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;if(!la)return;
      const ll=L.latLng(la,lo),nom=e.tags?.name||noms[t]+' (sans nom)';
      L.circleMarker(ll,{radius:8,color:'#fff',weight:2,fillColor:'#c8442b',fillOpacity:1}).addTo(lieux).bindPopup(popup(ll,nom));n++;
    });
    info.textContent=n?`${n} lieu(x) affiché(s). Touche un point pour l'utiliser.`:'Aucun lieu enregistré ici. Zoome ailleurs ou ajoute-le toi-même.';
  }catch(e){info.textContent='Lieux indisponibles pour le moment.'}
});

let addMode=false,saved=[];
try{saved=JSON.parse(localStorage.getItem('ouaga-lieux')||'[]')}catch(e){}
function showSaved(){perso.clearLayers();saved.forEach(p=>{const ll=L.latLng(p.la,p.lo);
  L.circleMarker(ll,{radius:9,color:'#fff',weight:2,fillColor:'#0f5c4a',fillOpacity:1}).addTo(perso).bindPopup(popup(ll,p.nom))})}
showSaved();
$('add').onclick=()=>{addMode=true;info.textContent='Touche la carte à l\'endroit exact du lieu à ajouter.'};
function addPlace(ll){
  addMode=false;
  const nom=(prompt('Nom du lieu (ex : Maquis Chez Awa)')||'').trim();
  if(!nom){info.textContent='Ajout annulé.';return}
  saved.push({nom,la:ll.lat,lo:ll.lng});
  try{localStorage.setItem('ouaga-lieux',JSON.stringify(saved))}catch(e){}
  showSaved();
  const quartier=(prompt('Dans quel quartier ? (facultatif)')||'').trim();
  const lien=`https://www.openstreetmap.org/?mlat=${ll.lat.toFixed(6)}&mlon=${ll.lng.toFixed(6)}#map=18/${ll.lat.toFixed(6)}/${ll.lng.toFixed(6)}`;
  const msg=`Nouveau lieu pour Ouaga Route\nNom : ${nom}\nQuartier : ${quartier||'non précisé'}\nPosition : ${lien}`;
  info.innerHTML='Lieu ajouté (en vert). <span id="st">Envoi en cours…</span><br>';
  envoyer(nom,quartier,ll);
  const wa=document.createElement('a');
  wa.href='https://wa.me/22673306209?text='+encodeURIComponent(msg);
  wa.target='_blank';wa.rel='noopener';wa.textContent='Prévenir aussi sur WhatsApp';
  wa.style.cssText='display:inline-block;margin-top:4px;padding:8px 10px;background:#25d366;color:#073b1d;border-radius:8px;font-weight:600;text-decoration:none';
  info.appendChild(wa);
}
</script>
<script>
const bounds=L.latLngBounds([12.26,-1.68],[12.49,-1.38]);
const map=L.map('map',{maxBounds:bounds,maxBoundsViscosity:1,minZoom:11}).setView([12.3714,-1.5197],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let pts={a:null,b:null},marks={a:null,b:null},line=null,active='a';
const $=id=>document.getElementById(id), info=$('info'), sug=$('sug');

  pts[k]=ll; if(label)$(k).value=label;
  if(marks[k])map.removeLayer(marks[k]);
  marks[k]=L.marker(ll,{title:k==='a'?'Départ':'Arrivée'}).addTo(map).bindTooltip(k==='a'?'Départ':'Arrivée');
}
map.on('click',e=>{
  if(!bounds.contains(e.latlng))return;

  const k=pts.a&&!pts.b?'b':(!pts.a?'a':'b');
  setPoint(k,e.latlng,'Point sur la carte');
  if(pts.a&&pts.b)route(); else info.textContent='Départ choisi. Touche maintenant l\'arrivée.';
});

async function search(q){
  const u='https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=bf&bounded=1&viewbox=-1.68,12.49,-1.38,12.26&q='+encodeURIComponent(q);
  const r=await fetch(u); return r.json();
}
let timer;
['a','b'].forEach(k=>$(k).addEventListener('input',()=>{
  active=k; clearTimeout(timer);
  const q=$(k).value.trim(); if(q.length<3){sug.hidden=true;return}
  timer=setTimeout(async()=>{
    try{
      const res=await search(q+' Ouagadougou');
      sug.innerHTML='';
      if(!res.length){sug.innerHTML='<li>Aucun lieu trouvé. Touche la carte à la place.</li>';sug.hidden=false;return}
      res.forEach(p=>{const li=document.createElement('li');li.textContent=p.display_name.split(',').slice(0,3).join(',');
        li.onclick=()=>{setPoint(k,L.latLng(+p.lat,+p.lon),li.textContent);sug.hidden=true;map.panTo([p.lat,p.lon]);if(pts.a&&pts.b)route()};
        sug.appendChild(li)});
      sug.hidden=false;
    }catch(e){info.textContent='Recherche indisponible. Touche la carte pour choisir un point.'}
  },500);
}));

$('loc').onclick=()=>{
  navigator.geolocation?.getCurrentPosition(p=>{
    const ll=L.latLng(p.coords.latitude,p.coords.longitude);
    if(!bounds.contains(ll)){info.textContent='Tu n\'es pas à Ouagadougou : choisis un départ sur la carte.';return}
    setPoint('a',ll,'Ma position');map.setView(ll,15);if(pts.b)route();
  },()=>info.textContent='Position refusée. Autorise la localisation ou choisis un point.');
};
$('swap').onclick=()=>{
  const A=pts.a,B=pts.b,va=$('a').value,vb=$('b').value;
  if(B)setPoint('a',B,vb);if(A)setPoint('b',A,va);
  if(pts.a&&pts.b)route();
};
$('go').onclick=()=>{ if(pts.a&&pts.b)route(); else info.textContent='Choisis d\'abord un départ et une arrivée.' };

async function route(){
  info.textContent='Calcul en cours…';
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${pts.a.lng},${pts.a.lat};${pts.b.lng},${pts.b.lat}?overview=full&geometries=geojson`;
    const d=await (await fetch(u)).json();
    if(!d.routes?.length){info.textContent='Aucun itinéraire trouvé entre ces deux points.';return}
    const r=d.routes[0];
    if(line)map.removeLayer(line);
    line=L.geoJSON(r.geometry,{style:{color:'#c8442b',weight:6}}).addTo(map);
    map.fitBounds(line.getBounds(),{padding:[40,40]});
    const km=(r.distance/1000).toFixed(1),min=Math.round(r.duration/60);
    info.innerHTML=`<b>${km} km</b> · environ <b>${min} min</b> en voiture`;
  }catch(e){info.textContent='Itinéraire indisponible. Vérifie ta connexion.'}
}
/* Base partagée Supabase */
const SB='https://ayepfiaxhutllnwaefei.supabase.co/rest/v1/lieux';
const SBH={apikey:'sb_publishable_ua2_ahv5DAou3x_Z9ZUNKw_SCGtf7m7'};
const commu=L.layerGroup().addTo(map);
async function chargerCommunaute(){
  try{
    const r=await fetch(SB+'?select=nom,quartier,lat,lng&approuve=eq.true',{headers:SBH});
    const d=await r.json();if(!Array.isArray(d))return;
    d.forEach(p=>{const ll=L.latLng(p.lat,p.lng);
      L.circleMarker(ll,{radius:9,color:'#fff',weight:2,fillColor:'#d9a21b',fillOpacity:1}).addTo(commu)
        .bindPopup(popup(ll,p.quartier?p.nom+' ('+p.quartier+')':p.nom))});
  }catch(e){}
}
async function envoyer(nom,quartier,ll){
  const st=()=>document.getElementById('st');
  try{
    const r=await fetch(SB,{method:'POST',headers:{...SBH,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify({nom,quartier:quartier||null,lat:ll.lat,lng:ll.lng})});
    if(st())st().textContent=r.ok?'Envoyé : il sera visible après vérification.':'Envoi impossible pour le moment.';
  }catch(e){if(st())st().textContent='Envoi impossible : pas de connexion.'}
}
chargerCommunaute();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
